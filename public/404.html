<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SanaCodes</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any path it doesn't recognize
      // (e.g. reloading /experience). We encode the real path into a query
      // string and redirect to the site root, where index.html's decode
      // script restores it via history.replaceState — no reload loop,
      // because replaceState never re-requests this 404 page.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
